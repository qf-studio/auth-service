name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SMOKE_IMAGE_NAME: ${{ github.repository }}-smoke

jobs:
  release:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke image (GH-495): a runnable verification artifact pinned to
      # the same tag as the service image above, so consumers (Pointer, the
      # canary cron in issue D) can verify a live deployment without a repo
      # checkout. Built in the same job as the service image (not a
      # separate parallel job) so a failure here fails the whole release —
      # the two images are published together or not at all.
      - name: Extract smoke metadata
        id: meta-smoke
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.SMOKE_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' }}
            type=ref,event=tag

      - name: Build and push smoke image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.smoke
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta-smoke.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.SMOKE_IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta-smoke.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migration-dry-run:
    name: Migration Dry-Run Check
    runs-on: ubuntu-latest
    needs: release
    env:
      # env context is unavailable in job-level env; build the ref from the
      # github context instead (REGISTRY/IMAGE_NAME must stay in sync above).
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      DATABASE_URL: postgres://auth:auth@localhost:5432/auth_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release image
        # Pulls the exact image the "release" job just built and pushed
        # (tagged with the commit sha), so this job proves the shipped
        # /auth-migrate binary works — not a locally rebuilt copy.
        run: docker pull "$IMAGE"

      - name: Migrate up
        # Runs the in-image migrate tool against the job's Postgres
        # service to prove the shipped binary actually applies migrations.
        run: |
          docker run --rm --network host --entrypoint /auth-migrate \
            -e DATABASE_URL \
            "$IMAGE" up

      - name: Migrate version (expect clean state)
        id: version
        run: |
          OUTPUT=$(docker run --rm --network host --entrypoint /auth-migrate \
            -e DATABASE_URL \
            "$IMAGE" version)
          echo "$OUTPUT"
          if [[ "$OUTPUT" == *dirty* ]]; then
            echo "schema reported dirty immediately after a clean 'up'" >&2
            exit 1
          fi
          echo "version=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Migrate force (exercise dirty-state recovery path)
        # Decision: force the schema to its own current version. This
        # doesn't need a real failure to inject — it proves the shipped
        # binary can clear a dirty flag and re-pin schema_migrations
        # in-image, which is the exact recovery path operators need
        # after a failed migration (2026-07-24 Pointer incident).
        env:
          SCHEMA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --network host --entrypoint /auth-migrate \
            -e DATABASE_URL \
            "$IMAGE" force "$SCHEMA_VERSION"

      - name: Migrate version (confirm force cleared dirty state)
        run: |
          OUTPUT=$(docker run --rm --network host --entrypoint /auth-migrate \
            -e DATABASE_URL \
            "$IMAGE" version)
          echo "$OUTPUT"
          if [[ "$OUTPUT" == *dirty* ]]; then
            echo "schema still dirty after force recovery" >&2
            exit 1
          fi

  # GH-496 (canary, TASK-01 issue D): after a successful tag release, fire
  # the auth-service-canary run so the just-published artifacts get an
  # end-to-end consumer-style verification within minutes, not at the next
  # daily cron. Non-blocking by design — a canary-dispatch failure must
  # never fail the release itself (continue-on-error + the canary repo also
  # runs on its own schedule as a backstop).
  trigger-canary:
    name: Trigger canary
    needs: [release, migration-dry-run]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Fire repository_dispatch on qf-studio/auth-service-canary
        env:
          GH_TOKEN: ${{ secrets.CANARY_GH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CANARY_GH_TOKEN not set — skipping canary dispatch (daily cron will cover)"
            exit 0
          fi
          gh api repos/qf-studio/auth-service-canary/dispatches \
            -f event_type=auth-service-release \
            -F "client_payload[tag]=$TAG_NAME"
