name: Deploy Auth Service (Pointer)

# Deploys auth-service into the Pointer AWS environment (getpointer.app trial):
# mirrors the pinned GHCR image into ECR, applies DB migrations, then deploys
# the ECS service stack from the template published to S3 by the infra repo.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string
      image_tag:
        description: Image tag to deploy (must exist on ghcr.io/qf-studio/auth-service)
        required: true
        default: v0.68.0
        type: string

permissions:
  contents: read
  packages: read

env:
  AWS_REGION: eu-central-1
  ECR_REPO: auth-service
  TEMPLATE_S3: s3://pointer-s3-app-data/templates/pointer/auth-service.yml

jobs:
  deploy:
    name: Mirror image, migrate DB, deploy service
    runs-on: [self-hosted, aws-pointer-deployer]

    steps:
      - name: Check confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo 'Not confirmed - type "deploy" in the confirm input to proceed.'
          exit 1

      - name: Checkout (for migrations/)
        uses: actions/checkout@v4

      - name: Mirror image GHCR -> ECR
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
          TAG="${{ inputs.image_tag }}"

          # ECR tags are immutable - skip the mirror if the tag already exists
          if aws ecr describe-images --repository-name "$ECR_REPO" \
               --image-ids imageTag="$TAG" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Tag $TAG already mirrored to ECR - skipping push"
            exit 0
          fi

          # Scratch docker config: ECR via credential helper, GHCR via login.
          # (The runner's global config routes everything to ecr-login, which
          # cannot store GHCR credentials.)
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-mirror"
          mkdir -p "$DOCKER_CONFIG"
          printf '{"credHelpers":{"%s":"ecr-login"}}' \
            "$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com" > "$DOCKER_CONFIG/config.json"

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/qf-studio/auth-service:$TAG"
          docker tag "ghcr.io/qf-studio/auth-service:$TAG" "$ECR_URI:$TAG"
          docker push "$ECR_URI:$TAG"
          echo "Mirrored ghcr.io/qf-studio/auth-service:$TAG -> $ECR_URI:$TAG"

      - name: Run database migrations
        run: |
          set -euo pipefail
          DB_HOST=$(aws ssm get-parameter --name /pointer/auth/DB_HOST --query Parameter.Value --output text --region "$AWS_REGION")
          DB_PORT=$(aws ssm get-parameter --name /pointer/auth/DB_PORT --query Parameter.Value --output text --region "$AWS_REGION")
          SECRET=$(aws secretsmanager get-secret-value --secret-id /pointer/auth/DB_SECRET --query SecretString --output text --region "$AWS_REGION")
          DB_USER=$(printf '%s' "$SECRET" | sed -E 's/.*"username": ?"([^"]+)".*/\1/')
          DB_PASS=$(printf '%s' "$SECRET" | sed -E 's/.*"password": ?"([^"]+)".*/\1/')

          docker run --rm -v "$PWD/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database "postgres://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/auth?sslmode=require" \
            up
          echo "Migrations applied"

      - name: Deploy service stack from S3 template
        run: |
          set -euo pipefail
          aws s3 cp "$TEMPLATE_S3" ./auth-service-stack.yml --region "$AWS_REGION"
          aws cloudformation deploy \
            --template-file ./auth-service-stack.yml \
            --stack-name pointer-svc-auth-service \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION" \
            --parameter-overrides \
              ImageTag="${{ inputs.image_tag }}" \
              JobId="${{ github.run_id }}" \
            --tags \
              AppManagerCFNStackKey=pointer-svc-auth-service \
              Environment=pointer \
              Relation=QuantFlow \
              Project=Pointer

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable --cluster pointer --services auth-service --region "$AWS_REGION"
          echo "auth-service is stable"
          curl -fsS --max-time 10 https://auth.getpointer.app/health && echo " - public health check OK" || echo "public health check not reachable yet (DNS/WAF may still be propagating)"
